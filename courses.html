<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курсы и гайды по плаванию — Алексей Лаврик</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    color: #0a2540;
    line-height: 1.7;
    padding: 60px 24px;
    background: #f8fbfd;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #0a2540;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #627d98;
    font-size: 18px;
    margin-bottom: 50px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.06);
    padding: 30px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  }
  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .card h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #0a2540;
  }
  .card p {
    font-size: 15px;
    color: #486581;
    margin-bottom: 20px;
    flex-grow: 1;
  }
  .price {
    font-size: 24px;
    font-weight: 700;
    color: #0077b6;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    color: #fff;
    border-radius: 50px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border: none;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,119,182,0.4);
    text-decoration: none;
  }
  .loading {
    text-align: center;
    color: #627d98;
    font-size: 18px;
    padding: 60px 0;
  }
  .error {
    text-align: center;
    color: #d32f2f;
    font-size: 16px;
    padding: 40px 0;
    background: #ffebee;
    border-radius: 12px;
  }
  .back {
    display: inline-block;
    margin-top: 40px;
    padding: 12px 28px;
    background: #fff;
    color: #0077b6;
    border: 2px solid #0077b6;
    border-radius: 50px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .back:hover {
    background: #0077b6;
    color: #fff;
    text-decoration: none;
  }
  .back-wrapper { text-align: center; }
  @media (max-width: 600px) {
    h1 { font-size: 28px; }
    .grid { grid-template-columns: 1fr; }
    body { padding: 40px 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Курсы и гайды</h1>
  <p class="subtitle">Готовые программы, которые помогут вам научиться плавать, победить страх воды и укрепить здоровье</p>

  <div id="courses-grid" class="grid">
    <div class="loading">Загрузка курсов...</div>
  </div>

  <div class="back-wrapper">
    <a href="https://lavrik-swim.ru" class="back">← Вернуться на главную</a>
  </div>
</div>

<script>
  async function loadCourses() {
    const grid = document.getElementById('courses-grid');

    try {
      const response = await fetch('data/courses.json');
      if (!response.ok) throw new Error('Не удалось загрузить данные');

      const data = await response.json();
      const courses = data.courses || [];

      if (courses.length === 0) {
        grid.innerHTML = '<div class="loading">Курсы скоро появятся</div>';
        return;
      }

      grid.innerHTML = '';

      courses.forEach(course => {
        const card = document.createElement('div');
        card.className = 'card';

        let imgHtml = '';
        if (course.image) {
          imgHtml = `<img src="${course.image}" alt="${course.title}" class="card-img">`;
        }

        card.innerHTML = `
          ${imgHtml}
          <h3>${course.title}</h3>
          <p>${course.description}</p>
          <div class="price">${course.price}</div>
          <a href="${course.payment_link}" class="btn" target="_blank">Купить</a>
        `;

        grid.appendChild(card);
      });
    } catch (error) {
      console.error('Ошибка загрузки курсов:', error);
      grid.innerHTML = '<div class="error">Не удалось загрузить курсы. Пожалуйста, обновите страницу.</div>';
    }
  }

  loadCourses();
</script>
</body>
</html>
